# ==========================================================================
# Base herdada por todos os canais. Não é um canal — o CLI ignora arquivos
# que começam com "_". Use `extends: _base` nos packs reais.
# ==========================================================================

nome: "Base"
idioma_legenda: pt-BR

# --------------------------------------------------------------------------
# Corrente de LLM: tentada na ordem. Chave ausente, 429, cota esgotada ou erro
# de servidor fazem o próximo elo assumir. Custo esperado: R$ 0.
# Veja a seção "Cadastro das LLMs" do README.
# --------------------------------------------------------------------------
llm:
  # Ordem validada empiricamente com roteiro real:
  #   ministral-14b  -> melhor qualidade de query e de era histórica
  #   gpt-oss-120b   -> bom e 2x mais rápido
  #   gpt-oss-20b    -> 3x mais rápido, queries mais rasas
  # Ver docs/opcoes-llm.md e a seção "Cadastro das LLMs" do README.
  chain:
    - { provider: mistral,    model: ministral-14b-2512,   tier: free }
    - { provider: groq,       model: openai/gpt-oss-120b,  tier: free }
    - { provider: groq,       model: openai/gpt-oss-20b,   tier: free }
    - { provider: zai,        model: glm-4.7-flash,        tier: free }
    - { provider: openrouter, model: z-ai/glm-4.5-air:free, tier: free }
  batch_size: 20
  cache_prompt: true
  temperature: 0.2
  max_output_tokens: 8000
  on_rate_limit: next_in_chain
  on_quota_exhausted: next_in_chain
  timeout_s: 120

provedores:
  prioridade: [pexels, pixabay, internet_archive]
  pesos: {}

midia:
  usar_rerank_semantico: true
  # Alvo de mistura da entrega: 20% dos blocos com vídeo, 80% com imagem.
  # Sobrescreva por canal. `null` desliga o alvo e sempre prefere vídeo.
  proporcao_video: 0.2

estetica:
  look_padrao: any
  aceita_4x3: true
  grao_permitido: true

briefing:
  vocabulario: ""
  intent_padrao: literal
  media_padrao: [video, photo]

politica:
  sensitivity_maxima: sensitive
  licencas_proibidas: []
  exige_sem_atribuicao: false

entrega:
  duracao_bloco: [4, 10]
  gap_maximo_s: 1.5
  resolucao_minima: 720
  alternativas_por_bloco: 2
